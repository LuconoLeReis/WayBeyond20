on:
  workflow_dispatch:

name: Validate WayBeyond20 builds

jobs:
  build:
    name: Test and build only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build WayBeyond20
        run: npm run build
